name: "CodeQL"

on: [push, pull_request]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true

    strategy:
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      with:
        persist-credentials: false

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # 2.2.0
      with:
        cmake-version: '3.13.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # 3.37.9
      with:
        languages: 'c-cpp'

    - name: Build
      run: |
        cmake -H. -B_build -DCMAKE_BUILD_TYPE=Debug -DMOREINTTYPES_ENABLE_UBSAN=ON
        cmake --build _build -- moreinttypes

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # 3.37.9
      with:
        category: "/language:c-cpp"
